name = "bwork-pos-api"
main = "worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "bworkpos_db"
database_id = "0f171606-080b-4380-bf91-167dc678e2e4"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bwork-uploads"

[triggers]
crons = ["* * * * *", "0 17 * * *"] # * * * * * = Auto-Cancel Expired Bookings (every 1 min), 0 17 * * * = 17:00 UTC Midnight Cloud Backup
